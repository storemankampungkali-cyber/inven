<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Inventory Modern</title>
<style>
  /* --- CSS VARIABLES & RESET --- */
  :root {
    --bg-dark: #121212;
    --bg-panel: #1e1e1e;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --accent: #8b5cf6;
    --text-main: #e5e7eb;
    --text-muted: #9ca3af;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --border: #374151;
    --glass: rgba(30, 30, 30, 0.7);
  }

  * { box-sizing: border-box; outline: none; }
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* --- NEXUS CUBE BACKGROUND ANIMATION --- */
  .scene {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    perspective: 1000px;
    overflow: hidden;
    pointer-events: none;
  }
  .cube {
    width: 200px; height: 200px;
    position: absolute;
    top: 50%; left: 50%;
    transform-style: preserve-3d;
    transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg);
    animation: spin 15s infinite linear;
    opacity: 0.3;
  }
  .cube-face {
    position: absolute; width: 200px; height: 200px;
    border: 2px solid var(--primary);
    background: rgba(59, 130, 246, 0.1);
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
  }
  .face-front  { transform: rotateY(0deg) translateZ(100px); }
  .face-back   { transform: rotateY(180deg) translateZ(100px); }
  .face-right  { transform: rotateY(90deg) translateZ(100px); }
  .face-left   { transform: rotateY(-90deg) translateZ(100px); }
  .face-top    { transform: rotateX(90deg) translateZ(100px); }
  .face-bottom { transform: rotateX(-90deg) translateZ(100px); }

  @keyframes spin {
    from { transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg); }
    to { transform: translate(-50%, -50%) rotateX(360deg) rotateY(360deg); }
  }

  /* --- LAYOUT --- */
  .app-container { display: none; height: 100vh; display: flex; }
  
  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px;
    transition: 0.3s;
  }
  .brand { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
  .nav-item {
    padding: 12px; margin-bottom: 5px;
    border-radius: 8px; cursor: pointer;
    color: var(--text-muted); transition: 0.2s;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
  
  /* Main Content */
  .main-content {
    flex: 1; padding: 30px;
    overflow-y: auto;
    position: relative;
  }

  /* --- LOGIN SCREEN --- */
  #login-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    z-index: 100; background: rgba(18, 18, 18, 0.9);
    backdrop-filter: blur(5px);
  }
  .login-card {
    background: var(--bg-panel); padding: 40px; border-radius: 16px;
    width: 100%; max-width: 400px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .login-header { text-align: center; margin-bottom: 30px; }
  .login-header h2 { margin: 0; color: var(--text-main); }
  
  /* --- FORMS & INPUTS --- */
  .form-group { margin-bottom: 20px; position: relative; }
  label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
  input, select, textarea {
    width: 100%; padding: 12px;
    background: #2d2d2d; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-main);
    font-size: 1rem; transition: 0.2s;
  }
  input:focus, select:focus { border-color: var(--primary); }
  
  .btn {
    width: 100%; padding: 12px;
    border: none; border-radius: 8px;
    background: var(--primary); color: white;
    font-weight: 600; cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-secondary { background: #374151; }
  .btn-danger { background: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; width: auto; }

  /* --- DASHBOARD CARDS --- */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px; margin-bottom: 30px;
  }
  .stat-card {
    background: var(--bg-panel); padding: 20px; border-radius: 12px;
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .stat-card h3 { margin: 0 0 10px 0; color: var(--text-muted); font-size: 0.9rem; }
  .stat-value { font-size: 2rem; font-weight: bold; color: var(--text-main); }
  .stat-icon { position: absolute; right: 20px; top: 20px; font-size: 1.5rem; opacity: 0.2; }

  /* --- TABLES & LISTS --- */
  .table-container { overflow-x: auto; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
  tr:hover { background: rgba(255,255,255,0.02); }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
  .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }

  /* --- AUTOCOMPLETE --- */
  .autocomplete-wrapper { position: relative; }
  .suggestions-list {
    position: absolute; top: 100%; left: 0; right: 0;
    background: #2d2d2d; border: 1px solid var(--border);
    border-radius: 8px; z-index: 50; max-height: 200px; overflow-y: auto;
    display: none;
  }
  .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #3d3d3d; }
  .suggestion-item.active, .suggestion-item:hover { background: var(--primary); color: white; }

  /* --- TOGGLE UNIT --- */
  .unit-toggle-group { display: flex; gap: 5px; margin-top: 5px; }
  .unit-btn {
    flex: 1; padding: 6px; font-size: 0.8rem;
    background: #374151; border: 1px solid transparent;
    color: var(--text-muted); cursor: pointer; border-radius: 4px;
  }
  .unit-btn.active { background: var(--primary); color: white; }

  /* --- TOASTS --- */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; }
  .toast {
    background: var(--bg-panel); color: var(--text-main);
    padding: 15px 20px; margin-bottom: 10px;
    border-radius: 8px; border-left: 4px solid var(--primary);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    animation: slideIn 0.3s forwards;
    display: flex; align-items: center; justify-content: space-between; min-width: 300px;
  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

  /* --- MODAL --- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); z-index: 150;
    display: none; align-items: center; justify-content: center;
  }
  .modal { background: var(--bg-panel); padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }

  /* Helpers */
  .hidden { display: none !important; }
  .flex-row { display: flex; gap: 10px; }
  .text-danger { color: var(--danger); }
  
  /* Loader */
  .loader {
    border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
    border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px;
  }
</style>
</head>
<body>

<!-- ANIMATION BACKGROUND -->
<div class="scene">
  <div class="cube">
    <div class="cube-face face-front"></div>
    <div class="cube-face face-back"></div>
    <div class="cube-face face-right"></div>
    <div class="cube-face face-left"></div>
    <div class="cube-face face-top"></div>
    <div class="cube-face face-bottom"></div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-header">
      <h2>Inventory Nexus</h2>
      <p style="color:var(--text-muted)">Masuk ke sistem</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn" id="btn-login">Login</button>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div class="app-container hidden" id="app-container">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="brand">
      <span>Nexus</span>Inv
    </div>
    <div class="nav-item active" onclick="app.navigate('dashboard')">
      <span>📊</span> Dashboard
    </div>
    <div class="nav-item" onclick="app.navigate('trans-in')">
      <span>📥</span> Barang Masuk
    </div>
    <div class="nav-item" onclick="app.navigate('trans-out')">
      <span>📤</span> Barang Keluar
    </div>
    <div class="nav-item" onclick="app.navigate('stock-opname')">
      <span>🔍</span> Stock Opname
    </div>
    <div class="nav-item" onclick="app.navigate('suppliers')">
      <span>🏭</span> Supplier
    </div>
    <div class="nav-item" onclick="app.navigate('reports')">
      <span>📑</span> Laporan
    </div>
    <div class="nav-item" onclick="app.navigate('admin')" id="nav-admin">
      <span>⚙️</span> Admin
    </div>
    <div style="margin-top: auto;">
      <div class="nav-item" onclick="app.logout()">
        <span>🚪</span> Logout
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="main-content" id="main-content">
    <!-- Content injected via JS -->
  </main>
</div>

<!-- MODAL CONFIRMATION -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <h3 id="modal-title">Konfirmasi</h3>
    <p id="modal-msg">Apakah Anda yakin?</p>
    <div class="flex-row" style="margin-top:20px; justify-content: flex-end;">
      <button class="btn btn-secondary btn-sm" onclick="ui.closeModal()">Batal</button>
      <button class="btn btn-sm" id="btn-confirm-action">Ya</button>
    </div>
  </div>
</div>

<script>
// --- KONFIGURASI ---
const GAS_URL = "https://script.google.com/macros/s/AKfycbz7aBnruqwHV7B6laZ6Lo8ZaKdpju7VXHa9US8IsSPs_HPVMkQvi8ZYLFeXX-RiQymzMQ/exec"; 

// --- STATE MANAGEMENT ---
const state = {
  user: JSON.parse(localStorage.getItem('inventory_user')) || null,
  currentView: 'dashboard',
  cart: [], // Untuk transaksi multi-item
  selectedItem: null, // Untuk autocomplete result
  unitMode: 'default', // default, alt1, alt2
  suppliers: [],
  allItems: [] // Cache frontend
};

// --- API SERVICE ---
const api = {
  async post(action, params = {}) {
    const payload = {
      action: action,
      params: params,
      session: state.user
    };

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      
      if (result.status === 'error' && result.message.includes('Login')) {
        app.logout();
      }
      return result;
    } catch (err) {
      console.error(err);
      ui.toast('Gagal menghubungi server', 'error');
      return { status: 'error', message: err.toString() };
    }
  }
};

// --- UI COMPONENTS & HELPERS ---
const ui = {
  get: (id) => document.getElementById(id),
  
  showLoader: (btnId, text) => {
    const btn = ui.get(btnId);
    if(btn) {
      btn.disabled = true;
      btn.innerHTML = `<div class="loader"></div> ${text || 'Loading...'}`;
    }
  },
  
  resetBtn: (btnId, text) => {
    const btn = ui.get(btnId);
    if(btn) {
      btn.disabled = false;
      btn.innerHTML = text;
    }
  },

  toast: (msg, type = 'success') => {
    const container = ui.get('toast-container');
    const el = document.createElement('div');
    el.className = `toast`;
    el.style.borderLeftColor = type === 'error' ? 'var(--danger)' : (type === 'warning' ? 'var(--warning)' : 'var(--primary)');
    el.innerHTML = `<span>${msg}</span>`;
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  },

  confirm: (msg, callback) => {
    ui.get('modal-msg').innerText = msg;
    ui.get('modal-confirm').style.display = 'flex';
    ui.get('btn-confirm-action').onclick = () => {
      callback();
      ui.closeModal();
    };
  },

  closeModal: () => {
    ui.get('modal-confirm').style.display = 'none';
  }
};

// --- APP LOGIC ---
const app = {
  init: () => {
    if (state.user) {
      app.showApp();
    } else {
      ui.get('login-screen').style.display = 'flex';
      ui.get('app-container').classList.add('hidden');
    }
    
    // Login Listener
    ui.get('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = ui.get('username').value;
      const p = ui.get('password').value;
      
      ui.showLoader('btn-login', 'Authenticating...');
      
      const res = await api.post('login', { username: u, password: p });
      
      if (res.status === 'success') {
        state.user = res.user;
        localStorage.setItem('inventory_user', JSON.stringify(res.user));
        ui.toast('Login Berhasil');
        app.showApp();
      } else {
        ui.toast(res.message, 'error');
        ui.resetBtn('btn-login', 'Login');
      }
    });
  },

  logout: () => {
    localStorage.removeItem('inventory_user');
    location.reload();
  },

  showApp: () => {
    ui.get('login-screen').style.display = 'none';
    ui.get('app-container').classList.remove('hidden');
    ui.get('app-container').style.display = 'flex';
    
    // RBAC: Hide Admin if not admin
    if (state.user.role !== 'Admin') {
      ui.get('nav-admin').classList.add('hidden');
    }
    
    app.navigate('dashboard');
  },

  navigate: (view) => {
    state.currentView = view;
    state.cart = []; // Reset cart on nav change
    
    // Update Sidebar Active State
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const activeNav = Array.from(document.querySelectorAll('.nav-item')).find(el => el.innerText.toLowerCase().includes(view.replace('-', ' ')));
    if(activeNav) activeNav.classList.add('active');

    // Render View
    const content = ui.get('main-content');
    content.innerHTML = '<div style="text-align:center; padding:50px;"><div class="loader" style="width:40px; height:40px;"></div></div>';
    
    switch(view) {
      case 'dashboard': app.renderDashboard(content); break;
      case 'trans-in': app.renderTransIn(content); break;
      case 'trans-out': app.renderTransOut(content); break;
      case 'stock-opname': app.renderStockOpname(content); break;
      case 'suppliers': app.renderSuppliers(content); break;
      case 'admin': app.renderAdmin(content); break;
      case 'reports': app.renderReports(content); break;
    }
  },

  // --- VIEW RENDERERS ---

  renderDashboard: async (container) => {
    const res = await api.post('getDashboard');
    if (res.status !== 'success') return;
    
    const d = res.data;
    container.innerHTML = `
      <h2 style="margin-top:0">Dashboard</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Barang</h3>
          <div class="stat-value">${d.totalItems}</div>
          <div class="stat-icon">📦</div>
        </div>
        <div class="stat-card">
          <h3>Total Stok Fisik</h3>
          <div class="stat-value">${d.totalStock}</div>
          <div class="stat-icon">📊</div>
        </div>
        <div class="stat-card" style="${d.lowStockCount > 0 ? 'border-color:var(--danger)' : ''}">
          <h3>Stok Menipis</h3>
          <div class="stat-value" style="color:${d.lowStockCount > 0 ? 'var(--danger)' : ''}">${d.lowStockCount}</div>
          <div class="stat-icon">⚠️</div>
        </div>
        <div class="stat-card">
          <h3>Transaksi Masuk (Hari Ini)</h3>
          <div class="stat-value">${d.inToday}</div>
        </div>
        <div class="stat-card">
          <h3>Transaksi Keluar (Hari Ini)</h3>
          <div class="stat-value">${d.outToday}</div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
        <div class="stat-card">
          <h3>⚠️ Peringatan Stok Menipis</h3>
          ${d.lowStockList.length === 0 ? '<p style="color:var(--text-muted)">Aman. Tidak ada stok kritis.</p>' : `
            <table style="font-size:0.9rem;">
              <thead><tr><th>Barang</th><th>Sisa</th><th>Min</th></tr></thead>
              <tbody>
                ${d.lowStockList.map(i => `<tr class="text-danger"><td>${i.name}</td><td>${i.stock}</td><td>${i.min}</td></tr>`).join('')}
              </tbody>
            </table>
          `}
        </div>
        <div class="stat-card">
          <h3>🔥 Top 3 Barang Keluar</h3>
          ${d.topItems.map((t, i) => `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
              <div>
                <strong>#${i+1} ${t.name}</strong>
                <div style="height:6px; width:100px; background:#333; margin-top:4px; border-radius:3px;">
                  <div style="height:100%; width:${(t.total / (d.topItems[0].total||1)) * 100}%; background:var(--primary); border-radius:3px;"></div>
                </div>
              </div>
              <span class="badge badge-success">${t.total}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  },

  renderTransIn: async (container) => {
    // Load Suppliers
    if(state.suppliers.length === 0) {
      const supRes = await api.post('getSuppliers');
      state.suppliers = supRes.data;
    }

    container.innerHTML = `
      <h2>Transaksi Barang Masuk</h2>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <div class="stat-card">
          <h3>Detail Transaksi</h3>
          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="ti-date" value="${new Date().toISOString().split('T')[0]}">
          </div>
          <div class="form-group">
            <label>Supplier</label>
            <select id="ti-supplier">
              <option value="">Pilih Supplier</option>
              ${state.suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="flex-row">
            <div class="form-group" style="flex:1">
              <label>No. PO</label>
              <input type="text" id="ti-po">
            </div>
            <div class="form-group" style="flex:1">
              <label>No. Surat Jalan</label>
              <input type="text" id="ti-sj">
            </div>
          </div>
          <div class="form-group">
            <label>Upload Foto (Max 2)</label>
            <input type="file" id="ti-photos" multiple accept="image/*">
          </div>
        </div>
        
        <div class="stat-card">
          <h3>Tambah Item</h3>
          <div class="autocomplete-wrapper">
            <label>Cari Nama Barang</label>
            <input type="text" id="ti-search" placeholder="Ketik nama barang..." autocomplete="off">
            <div class="suggestions-list" id="ti-suggestions"></div>
          </div>
          
          <div id="ti-unit-selector" class="hidden" style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
            <label>Pilih Satuan</label>
            <div class="unit-toggle-group" id="ti-units"></div>
            
            <div class="flex-row" style="margin-top:15px;">
              <div class="form-group" style="flex:2">
                <label>Quantity</label>
                <input type="number" id="ti-qty" min="1" value="1">
              </div>
              <div class="form-group" style="flex:1">
                <label>Stock Update</label>
                <input type="text" id="ti-stock-preview" readonly disabled style="background:#222;">
              </div>
            </div>
            
            <button class="btn" onclick="app.addToCart('in')">+ Tambahkan ke List</button>
          </div>
        </div>
      </div>

      <div class="stat-card" style="margin-top:20px;">
        <h3>Item List Preview</h3>
        <div class="table-container">
          <table>
            <thead><tr><th>Barang</th><th>Satuan</th><th>Qty Input</th><th>Konversi</th><th>Aksi</th></tr></thead>
            <tbody id="ti-cart-body"></tbody>
          </table>
        </div>
        <div style="margin-top:20px; text-align:right;">
          <button class="btn" style="width:auto; padding-left:30px; padding-right:30px;" onclick="app.submitTransIn()">Simpan Transaksi</button>
        </div>
      </div>
    `;
    app.initAutocomplete('ti-search', 'ti-suggestions', 'ti-units', 'ti-qty', 'ti-stock-preview');
  },

  renderTransOut: (container) => {
    container.innerHTML = `
      <h2>Transaksi Barang Keluar</h2>
      <div class="flex-row" style="align-items:flex-start">
        <div class="stat-card" style="flex:1">
          <h3>Tambah Item Keluar</h3>
          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="to-date" value="${new Date().toISOString().split('T')[0]}">
          </div>
          <div class="autocomplete-wrapper">
            <label>Cari Barang</label>
            <input type="text" id="to-search" placeholder="Ketik nama barang..." autocomplete="off">
            <div class="suggestions-list" id="to-suggestions"></div>
          </div>
          
          <div id="to-unit-selector" class="hidden" style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <label>Stok Tersedia:</label>
              <strong id="to-stock-avail" style="color:var(--primary)">0</strong>
            </div>
            <label>Pilih Satuan</label>
            <div class="unit-toggle-group" id="to-units"></div>
            
            <div class="flex-row" style="margin-top:15px;">
              <div class="form-group" style="flex:2">
                <label>Quantity</label>
                <input type="number" id="to-qty" min="1" value="1">
              </div>
               <div class="form-group" style="flex:1">
                <label>Akan Dikurangi</label>
                <input type="text" id="to-stock-preview" readonly disabled style="background:#222;">
              </div>
            </div>
            
            <button class="btn btn-danger" onclick="app.addToCart('out')">+ Tambahkan</button>
          </div>
        </div>

        <div class="stat-card" style="flex:1.5; margin-left:20px;">
          <h3>Keranjang Barang Keluar</h3>
          <div class="table-container">
            <table>
              <thead><tr><th>Barang</th><th>Satuan</th><th>Qty</th><th>Total</th><th>Aksi</th></tr></thead>
              <tbody id="to-cart-body"></tbody>
            </table>
          </div>
          <div style="margin-top:20px; text-align:right;">
            <button class="btn btn-danger" style="width:auto; padding-left:30px; padding-right:30px;" onclick="app.submitTransOut()">Proses Barang Keluar</button>
          </div>
        </div>
      </div>
    `;
    app.initAutocomplete('to-search', 'to-suggestions', 'to-units', 'to-qty', 'to-stock-preview');
  },
  
  renderStockOpname: async (container) => {
     container.innerHTML = `
      <h2>Stock Opname</h2>
      <div class="stat-card" style="max-width:600px; margin:0 auto;">
        <div class="form-group">
          <label>Pilih Barang</label>
          <input type="text" id="so-search" placeholder="Cari barang..." autocomplete="off">
          <div class="suggestions-list" id="so-suggestions"></div>
        </div>
        
        <div id="so-details" class="hidden">
          <div class="form-group">
            <label>Stok Sistem</label>
            <input type="text" id="so-sys" readonly disabled style="background:#222;">
          </div>
          <div class="form-group">
            <label>Stok Fisik (Input)</label>
            <input type="number" id="so-phys">
          </div>
          <div class="form-group">
            <label>Satuan Input</label>
             <select id="so-unit"><option>Default</option></select>
          </div>
          <div class="form-group">
            <label>Keterangan</label>
            <textarea id="so-note"></textarea>
          </div>
          <button class="btn" onclick="app.submitOpname()">Simpan Koreksi</button>
        </div>
      </div>
     `;
     
     // Special simple search for Opname
     app.initAutocomplete('so-search', 'so-suggestions', null, null, null, true);
  },

  renderSuppliers: async (container) => {
    if(state.suppliers.length === 0) {
      const res = await api.post('getSuppliers');
      state.suppliers = res.data;
    }
    container.innerHTML = `
      <h2>Data Supplier</h2>
      <button class="btn btn-secondary btn-sm" style="width:auto; margin-bottom:15px;" onclick="ui.toast('Fitur tambah supplier (modal form) dapat dikembangkan serupa dengan add item')">+ Tambah Supplier</button>
      <div class="table-container">
        <table>
          <thead><tr><th>Nama</th><th>Alamat</th><th>Telepon</th><th>Aksi</th></tr></thead>
          <tbody>
            ${state.suppliers.map(s => `
              <tr>
                <td>${s.name}</td>
                <td>${s.address}</td>
                <td>${s.phone}</td>
                <td><button class="btn btn-sm btn-danger" onclick="ui.toast('Hapus supplier logic')">Hapus</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  renderAdmin: async (container) => {
    container.innerHTML = `
      <h2>Admin Panel</h2>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <div class="stat-card">
          <h3>Upload Master Data (CSV)</h3>
          <p style="font-size:0.85rem; color:var(--text-muted)">Format: Name, DefUnit, Alt1, Factor1, Alt2, Factor2, MinStock, Stock</p>
          <textarea id="admin-csv" rows="5" placeholder="Nama Barang,Pcs,Box,12,...</textarea>
          <button class="btn btn-sm" style="margin-top:10px;" onclick="app.adminImportCSV()">Upload CSV</button>
        </div>
        <div class="stat-card">
          <h3>Activity Log (Last 100)</h3>
          <div id="log-list" style="max-height:200px; overflow-y:auto; font-size:0.8rem;">
            Loading...
          </div>
        </div>
      </div>
      
      <div class="stat-card" style="margin-top:20px;">
        <h3>Master Barang</h3>
        <div class="table-container">
           <table>
             <thead><tr><th>ID</th><th>Nama</th><th>Stok</th><th>Min</th></tr></thead>
             <tbody id="admin-items-body"></tbody>
           </table>
        </div>
      </div>
    `;
    
    // Load Logs & Items
    const [logRes, itemRes] = await Promise.all([
      api.post('getLogs'), api.post('getItemsMaster')
    ]);
    
    if(logRes.status === 'success') {
      ui.get('log-list').innerHTML = logRes.data.map(l => `<div><b>${l.user}</b>: ${l.action} - ${l.time}</div>`).join('');
    }
    
    if(itemRes.status === 'success') {
      ui.get('admin-items-body').innerHTML = itemRes.data.map(i => `<tr><td>${i.id}</td><td>${i.name}</td><td>${i.stock}</td><td>${i.min}</td></tr>`).join('');
    }
  },
  
  renderReports: (container) => {
    container.innerHTML = `
      <h2>Laporan & Export</h2>
      <div class="stat-card" style="max-width:500px">
        <div class="form-group">
          <label>Jenis Laporan</label>
          <select id="rep-type">
            <option value="in">Barang Masuk</option>
            <option value="out">Barang Keluar</option>
            <option value="opname">Stock Opname</option>
          </select>
        </div>
        <div class="flex-row">
          <div class="form-group" style="flex:1"><label>Mulai</label><input type="date" id="rep-start"></div>
          <div class="form-group" style="flex:1"><label>Sampai</label><input type="date" id="rep-end"></div>
        </div>
        <button class="btn" onclick="app.exportCSV()">Download CSV</button>
      </div>
    `;
  },

  // --- LOGIC: AUTOCOMPLETE & UNITS ---

  initAutocomplete: (inputId, listId, unitContainerId, qtyInputId, previewId, isOpname = false) => {
    const input = ui.get(inputId);
    const list = ui.get(listId);
    let itemsCache = [];

    input.addEventListener('input', async (e) => {
      const q = e.target.value;
      if (q.length < 2) {
        list.style.display = 'none';
        return;
      }
      
      const res = await api.post('searchItems', { query: q });
      if (res.status === 'success') {
        state.allItems = res.data; // Update cache
        app.renderSuggestions(res.data, list, input, unitContainerId, qtyInputId, previewId, isOpname);
      }
    });

    // Keyboard Nav
    input.addEventListener('keydown', (e) => {
      // Logic for ArrowUp/Down/Enter can be added here
      if(e.key === 'Escape') list.style.display = 'none';
    });
    
    // Close on click outside
    document.addEventListener('click', (e) => {
      if (e.target !== input) list.style.display = 'none';
    });
  },

  renderSuggestions: (items, listEl, inputEl, unitContId, qtyId, prevId, isOpname) => {
    listEl.innerHTML = '';
    if(items.length === 0) { listEl.style.display = 'none'; return; }
    
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.innerHTML = `<b>${item.display}</b> <span style="font-size:0.8rem; color:#888">Stok: ${item.stock} ${item.defaultUnit}</span>`;
      div.onclick = () => {
        inputEl.value = item.display;
        state.selectedItem = item;
        listEl.style.display = 'none';
        app.handleItemSelect(item, unitContId, qtyId, prevId, isOpname);
      };
      listEl.appendChild(div);
    });
    listEl.style.display = 'block';
  },

  handleItemSelect: (item, unitContId, qtyId, prevId, isOpname) => {
    state.unitMode = 'default';
    if (!unitContId) return; // Only for simple select

    const container = ui.get(unitContId);
    const qtyInput = ui.get(qtyId);
    const prevInput = ui.get(prevId);
    
    container.parentElement.classList.remove('hidden');
    
    // Render Unit Buttons
    let html = `<button class="unit-btn active" onclick="app.setUnit('default', ${item.defaultUnit ? 0 : 1}, '${unitContId}', '${qtyId}', '${prevId}')">${item.defaultUnit || 'Unit'}</button>`;
    if (item.alt1) html += `<button class="unit-btn" onclick="app.setUnit('alt1', ${item.factor1}, '${unitContId}', '${qtyId}', '${prevId}')">${item.alt1}</button>`;
    if (item.alt2) html += `<button class="unit-btn" onclick="app.setUnit('alt2', ${item.factor2}, '${unitContId}', '${qtyId}', '${prevId}')">${item.alt2}</button>`;
    
    container.innerHTML = html;
    
    // If Opname
    if (isOpname) {
      ui.get('so-details').classList.remove('hidden');
      ui.get('so-sys').value = `${item.stock} ${item.defaultUnit}`;
    } else {
      // Update Stock Available for Trans Out
      if (unitContId.includes('to')) {
        ui.get('to-stock-avail').innerText = `${item.stock} ${item.defaultUnit}`;
      }
    }
    
    app.calcPreview(qtyInput.value);
    qtyInput.oninput = (e) => app.calcPreview(e.target.value);
  },

  setUnit: (mode, factor, contId, qtyId, prevId) => {
    state.unitMode = mode;
    state.currentFactor = factor;
    
    // Update Buttons
    const btns = ui.get(contId).querySelectorAll('.unit-btn');
    btns.forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    app.calcPreview(ui.get(qtyId).value);
  },

  calcPreview: (qty) => {
    if (!state.selectedItem) return;
    const factor = state.unitMode === 'default' ? 1 : state.currentFactor;
    const total = Number(qty) * factor;
    if (ui.get('ti-stock-preview')) ui.get('ti-stock-preview').value = total + ' ' + state.selectedItem.defaultUnit;
    if (ui.get('to-stock-preview')) ui.get('to-stock-preview').value = total + ' ' + state.selectedItem.defaultUnit;
  },

  addToCart: (type) => {
    const qty = Number(ui.get(type === 'in' ? 'ti-qty' : 'to-qty').value);
    if (qty <= 0) return ui.toast('Quantity tidak valid', 'error');
    
    const factor = state.unitMode === 'default' ? 1 : state.currentFactor;
    const qtyDefault = qty * factor;
    const unitName = state.unitMode === 'default' ? state.selectedItem.defaultUnit : (state.unitMode === 'alt1' ? state.selectedItem.alt1 : state.selectedItem.alt2);
    
    const item = {
      id: state.selectedItem.id,
      name: state.selectedItem.display,
      qty: qty,
      unit: unitName,
      mode: state.unitMode,
      qtyDefault: qtyDefault
    };
    
    state.cart.push(item);
    app.renderCart(type);
    ui.get(type === 'in' ? 'ti-search' : 'to-search').value = '';
    ui.get(type === 'in' ? 'ti-unit-selector' : 'to-unit-selector').classList.add('hidden');
    state.selectedItem = null;
  },

  renderCart: (type) => {
    const tbody = ui.get(type === 'in' ? 'ti-cart-body' : 'to-cart-body');
    tbody.innerHTML = state.cart.map((item, idx) => `
      <tr>
        <td>${item.name}</td>
        <td><span class="badge badge-success">${item.unit}</span></td>
        <td>${item.qty}</td>
        <td>${item.qtyDefault}</td>
        <td><button class="btn btn-sm btn-danger" onclick="app.removeCartItem(${idx}, '${type}')">X</button></td>
      </tr>
    `).join('');
  },

  removeCartItem: (idx, type) => {
    state.cart.splice(idx, 1);
    app.renderCart(type);
  },

  submitTransIn: async () => {
    if (state.cart.length === 0) return ui.toast('Keranjang kosong', 'error');
    
    const photosInput = ui.get('ti-photos').files;
    // Note: Real upload logic skipped for brevity, sending empty array
    
    const params = {
      date: ui.get('ti-date').value,
      supplierId: ui.get('ti-supplier').value,
      poNum: ui.get('ti-po').value,
      sjNum: ui.get('ti-sj').value,
      items: state.cart,
      photos: [] 
    };
    
    ui.showLoader(null, 'Saving...'); // Using global loader simulation
    
    const res = await api.post('processTransactionIn', params);
    if (res.status === 'success') {
      ui.toast('Transaksi Masuk Berhasil');
      app.navigate('dashboard');
    } else {
      ui.toast(res.message, 'error');
    }
    ui.resetBtn(null, 'Save');
  },

  submitTransOut: async () => {
    if (state.cart.length === 0) return ui.toast('Keranjang kosong', 'error');
    
    const params = {
      date: ui.get('to-date').value,
      items: state.cart
    };
    
    const res = await api.post('processTransactionOut', params);
    if (res.status === 'success') {
      ui.toast('Transaksi Keluar Berhasil');
      app.navigate('dashboard');
    } else {
      ui.toast(res.message, 'error');
    }
  },
  
  submitOpname: async () => {
     const params = {
       item: state.selectedItem,
       physical: ui.get('so-phys').value,
       note: ui.get('so-note').value
     };
     const res = await api.post('processStockOpname', params);
     if(res.status === 'success') {
       ui.toast('Stock Opname Disimpan');
       app.navigate('dashboard');
     }
  },

  adminImportCSV: async () => {
    const csv = ui.get('admin-csv').value;
    if (!csv) return ui.toast('CSV kosong', 'error');
    
    const res = await api.post('importItems', { csv: csv });
    if(res.status === 'success') {
      ui.toast(`Berhasil import ${res.count} barang`);
      ui.get('admin-csv').value = '';
    }
  },
  
  exportCSV: async () => {
    const type = ui.get('rep-type').value;
    const start = ui.get('rep-start').value;
    const end = ui.get('rep-end').value;
    
    const res = await api.post('exportReport', { type, start, end });
    if(res.status === 'success') {
      const blob = new Blob([res.csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = res.filename;
      a.click();
    }
  }
};

// Start App
app.init();

</script>
</body>
</html>
